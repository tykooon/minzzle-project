name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/minzzle-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # ── Build & push Docker image (server) ────────────────────────
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # ── Build React frontend ──────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci && npm run build

      # ── Set up SSH ────────────────────────────────────────────────
      # Note: ssh-keyscan is intentionally omitted — all ssh/rsync calls
      # below use StrictHostKeyChecking=no, so known_hosts is not consulted.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n  ConnectTimeout 60\n' >> ~/.ssh/config

      # ── Test SSH connection ───────────────────────────────────────
      - name: Test SSH
        run: |
          ssh -vvv -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo SSH_OK" 2>&1 | tail -50

      # ── Deploy static frontend ────────────────────────────────────
      - name: Deploy web
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            web/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/minzzle/web/"

      # ── Sync docker-compose.yml to VPS ───────────────────────────
      - name: Sync compose file
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/minzzle/docker-compose.yml"

      # ── Write production .env from secrets ─────────────────────────
      # NOTE: this no longer ships a database file. Schema is created by EF
      # migrations on container start; levels are seeded from the embedded
      # snapshot. User data lives in the Postgres named volume and survives
      # deploys. (Previously this step rsynced minzzle.db over production,
      # which would wipe accounts/progress on every push.)
      - name: Write production .env
        run: |
          cat > /tmp/minzzle.env <<'EOF'
          GITHUB_REPO_OWNER=${{ github.repository_owner }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minzzle;Username=minzzle;Password=${{ secrets.DB_PASSWORD }}
          Authentication__Google__ClientId=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          Authentication__Google__ClientSecret=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          Authentication__Microsoft__ClientId=${{ secrets.OAUTH_MICROSOFT_CLIENT_ID }}
          Authentication__Microsoft__ClientSecret=${{ secrets.OAUTH_MICROSOFT_CLIENT_SECRET }}
          Authentication__Facebook__AppId=${{ secrets.OAUTH_FACEBOOK_APP_ID }}
          Authentication__Facebook__AppSecret=${{ secrets.OAUTH_FACEBOOK_APP_SECRET }}
          Auth__AdminEmails__0=${{ secrets.ADMIN_EMAIL }}
          EOF
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ~/minzzle"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            /tmp/minzzle.env \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/minzzle/.env"
          rm -f /tmp/minzzle.env

      # ── Pull new image & restart container ────────────────────────
      - name: Deploy server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/minzzle && docker compose pull && docker compose up -d"
